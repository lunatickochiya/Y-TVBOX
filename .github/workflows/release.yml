name: Y-TVBOX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set release tag
        run: echo "RELEASE_TAG=Y-TVBOX-$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.YTVBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YTVBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YTVBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YTVBOX_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ytvbox-signing"
          KEYSTORE_FILE="$RUNNER_TEMP/ytvbox-signing/release.jks"

          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          elif [[ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo "YTVBOX signing secrets are incomplete." >&2
            exit 1
          else
            echo "::warning::Using a temporary signing key. Configure YTVBOX signing secrets to support APK upgrades."
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=ytvbox
            KEY_PASSWORD=android
            keytool -genkeypair \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Y-TVBOX Temporary,OU=GitHub Actions,O=Y-TVBOX,C=CN"
          fi

          {
            echo "YTVBOX_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "YTVBOX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "YTVBOX_KEY_ALIAS=$KEY_ALIAS"
            echo "YTVBOX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:assembleArmeabiGenericNormalRelease \
            :app:assembleArm64GenericNormalRelease \
            --no-daemon --stacktrace

      - name: Collect and verify APKs
        run: |
          mkdir -p release
          find app/build/outputs/apk -type f -name 'Y-TVBOX_*.apk' -exec cp '{}' release/ \;
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          for apk in release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          cd release
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Y-TVBOX $RELEASE_TAG" \
              --generate-notes
          fi
