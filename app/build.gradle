apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def static buildTime() {
    return new Date().format("yyyyMMdd_HHmm", TimeZone.getTimeZone("GMT+08:00"))
}

def releaseKeystorePath = System.getenv("YTVBOX_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("YTVBOX_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("YTVBOX_KEY_ALIAS")
def releaseKeyPassword = System.getenv("YTVBOX_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 36

    defaultConfig {
        applicationId 'com.github.ylive.osc'
        // media3 1.11 / nextlib 1.11 最低要求 API 23；Android 5.x 请使用 android5 分支
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.".concat(buildTime())
        // 「关于」里显示的编译时间(yyyyMMdd_HHmm, GMT+8)
        buildConfigField "String", "BUILD_TIME", "\"${buildTime()}\""
        multiDexEnabled true
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions += ["abi", "brand", "mode", "player"]
    productFlavors {
        armeabi {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        generic  {
            //通用版本
            dimension = "brand"
        }

        hisense {
            //海信的
            applicationId 'com.github.ylive.osc.hisense'
            dimension = "brand"
        }
        normal {
            dimension = "mode"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        std {
            // 标准版: 不打包 libmpv, 保持 ~16MB
            dimension = "player"
        }
        mpv {
            // MPV 版: 额外打包 libmpv/FFmpeg, 每个 ABI 约 +30MB。
            // 与标准版同包名/签名, 可直接覆盖安装并保留直播源与设置。
            dimension = "player"
            versionNameSuffix '-mpv'
        }
    }
    sourceSets {
        std.java.srcDir 'src/std/java'
        mpv.java.srcDir 'src/mpv/java'
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorNames = variant.productFlavors.findAll {
                it.name != "normal" && !(it.dimension == "player" && it.name == "std")
            }.collect { it.name }.join('-')
            // 构建自定义文件名: std 保持原名, mpv 版带 -mpv
            def fileName = "Y-LIVE_${variant.buildType.name}-${flavorNames}.apk"
            outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

configurations {
    // 只用来定位上游 MPV AAR，不参与编译/打包
    mpvUpstream {
        transitive = false
    }
}

def patchedMpvAar = tasks.register('patchMpvAar', Exec) {
    def upstream = configurations.mpvUpstream
    def output = layout.buildDirectory.file('mpv-patched/mpv-android-lib.aar')
    inputs.files(upstream)
    inputs.file("$rootDir/scripts/patch-mpv-libs.py")
    outputs.file(output)
    doFirst {
        def aar = upstream.files.find { it.name.endsWith('.aar') }
        if (aar == null) throw new GradleException('mpv-android-lib AAR not found')
        output.get().asFile.parentFile.mkdirs()
        commandLine 'python3', "$rootDir/scripts/patch-mpv-libs.py",
                aar.absolutePath, output.get().asFile.absolutePath
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-project-2.3.1'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    // X5/Gecko 内核版已移除: y-live 是纯直播应用, 不做点播嗅探
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.11'
    implementation 'com.squareup.okio:okio:3.3.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.49-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.11.1"
    implementation "androidx.media3:media3-datasource-rtmp:1.11.1"
    implementation 'androidx.media3:media3-common:1.11.1'
    // nextlib 1.11.1 修复了 FFmpeg 软解 Surface 颜色(Color/YV12)、Surface CPU
    // 连接未释放、输出帧清理等问题, 是 exo 软解花屏/绿屏的主要修复版本
    implementation "io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.16.0"

    // MPV 版: 上游 AAR 会与 nextlib 的 libavcodec.so 等重名，先通过
    // scripts/patch-mpv-libs.py 把 MPV 的 FFmpeg 库改名再打包。标准版不打包。
    mpvUpstream 'io.github.wohal:mpv-android-lib:0.2.4'
    mpvImplementation files(patchedMpvAar)
    mpvImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.lzy.net:okgo:3.0.4'
    // BaseVideoController 等播放器 UI 基类来自 dkplayer-ui(点播用的 videocache 已移除)
    implementation 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.blankj:utilcodex:1.31.0'
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'commons-io:commons-io:2.13.0'
    implementation 'io.github.inflationx:viewpump:2.1.1'
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }
}
