apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.yanzhenjie.andserver'

def static buildTime() {
    return new Date().format("yyyyMMdd_HHmm", TimeZone.getTimeZone("GMT+08:00"))
}

def releaseKeystorePath = System.getenv("YTVBOX_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("YTVBOX_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("YTVBOX_KEY_ALIAS")
def releaseKeyPassword = System.getenv("YTVBOX_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

// 本地构建便利: 没有设置 CI 签名环境变量时，如果仓库根目录存在 signing/ 下的
// 发布密钥和 signing-info.txt，则自动用它签名，避免 assembleRelease 产出未签名 APK
// (未签名 APK 在电视上会报 INSTALL_PARSE_FAILED_NO_CERTIFICATES)。
def usingLocalSigning = false
def localSigningInfo = file("$rootDir/signing/ytvbox-signing-info.txt")
def localKeystore = file("$rootDir/signing/ytvbox-release.p12")
if (!hasReleaseSigning && localSigningInfo.exists() && localKeystore.exists()) {
    def props = new Properties()
    localSigningInfo.withInputStream { props.load(it) }
    releaseKeystorePath = localKeystore.absolutePath
    releaseKeystorePassword = props.getProperty("YTVBOX_KEYSTORE_PASSWORD")
    releaseKeyAlias = props.getProperty("YTVBOX_KEY_ALIAS")
    releaseKeyPassword = props.getProperty("YTVBOX_KEY_PASSWORD")
    hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
            .every { it != null && !it.isEmpty() }
    usingLocalSigning = hasReleaseSigning
}

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 36

    defaultConfig {
        applicationId 'com.github.ytvbox.osc'
        // media3 1.11 / nextlib 1.11 最低要求 API 23
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.".concat(buildTime())
        // 「关于」里显示的编译时间(yyyyMMdd_HHmm, GMT+8)
        buildConfigField "String", "BUILD_TIME", "\"${buildTime()}\""
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                if (usingLocalSigning) storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions += ["abi", "brand", "mode", "player"]
    productFlavors {
        armeabi {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        generic  {
            //通用版本
            dimension = "brand"
        }

        hisense {
            //海信的
            applicationId 'com.github.ytvbox.osc.hisense'
            dimension = "brand"
        }
        normal {
            dimension = "mode"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        python {
            dimension = "mode"
            minSdkVersion 24
            // Python 版本需要额外的 Proguard 规则
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
        x5 {
            // X5 内核版: 在 Java 版基础上打包腾讯 TBS/X5 SDK, 提供 X5 WebView 嗅探内核
            dimension = "mode"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        gecko {
            // Gecko 内核版: 打包 Mozilla GeckoView(omni AAR 含全部 ABI, 打包时按 abiFilters 只留对应 ABI)
            dimension = "mode"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        regular {
            // 标准版: 不打包 libmpv
            dimension = "player"
        }
        mpv {
            // MPV 版: 额外打包 libmpv/FFmpeg, 与标准版同包名同签名, 可覆盖安装
            dimension = "player"
            versionNameSuffix '-mpv'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorNames = variant.productFlavors.findAll {
                it.name != "normal" && !(it.dimension == "player" && it.name == "regular")
            }.collect { it.name }.join('-')
            // 构建自定义文件名: regular 保持原名, mpv 版带 -mpv
            def fileName = "Y-TVBOX_main_${variant.buildType.name}-${flavorNames}.apk"
            outputFileName = fileName
        }
    }

    sourceSets {
        // 各内核版本按需组合实现/空实现源集:
        //   std = X5Support 空实现, geckostub = GeckoSupport 空实现, normal = pyLoader 桩
        normal.java.srcDir 'src/std/java'
        normal.java.srcDir 'src/geckostub/java'
        python.java.srcDir 'src/std/java'
        python.java.srcDir 'src/geckostub/java'
        x5.java.srcDir 'src/geckostub/java'
        x5.java.srcDir 'src/normal/java'
        gecko.java.srcDir 'src/std/java'
        gecko.java.srcDir 'src/normal/java'
        regular.java.srcDir 'src/regular/java'
        mpv.java.srcDir 'src/mpv/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }

    androidResources {
        // X5 内核(.tbs)本身是压缩包, 不再二次压缩, 加快打包与运行时拷贝
        noCompress 'tbs'
    }
}

// X5 内置内核: 只为 x5 变体打包对应 ABI 的内核文件(app/src/x5core/<abi>/assets/tbs/*.tbs),
// 普通/python 变体不包含, 避免 APK 体积膨胀
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.productFlavors.any { it.second == "x5" }) {
            def abi = variant.productFlavors.find { it.first == "abi" }?.second ?: "arm64"
            variant.sources.assets?.addStaticSourceDirectory("src/x5core/${abi}")
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        freeCompilerArgs.add("-Xskip-metadata-version-check")
    }
}

configurations {
    // 只用来定位上游 MPV AAR，不参与编译/打包
    mpvUpstream {
        transitive = false
    }
}

def patchedMpvAar = tasks.register('patchMpvAar', Exec) {
    def upstream = configurations.mpvUpstream
    def output = layout.buildDirectory.file('mpv-patched/mpv-android-lib.aar')
    inputs.files(upstream)
    inputs.file("$rootDir/scripts/patch-mpv-libs.py")
    outputs.file(output)
    doFirst {
        def aar = upstream.files.find { it.name.endsWith('.aar') }
        if (aar == null) throw new GradleException('mpv-android-lib AAR not found')
        output.get().asFile.parentFile.mkdirs()
        commandLine 'python3', "$rootDir/scripts/patch-mpv-libs.py",
                aar.absolutePath, output.get().asFile.absolutePath
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // for WebDAV
    implementation('com.github.thegrizzlylabs:sardine-android:0.8') {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-project-2.3.1'
    implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-websocket-2.3.1'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation project(path: ':quickjs')
    pythonImplementation project(":pyramid")
    // X5 内核版: 腾讯 TBS/X5 SDK
    x5Implementation 'com.tencent.tbs:tbssdk:44286'
    // Gecko 内核版: Mozilla GeckoView(144 是最后支持 Android 5.0+ 的版本)
    geckoImplementation('org.mozilla.geckoview:geckoview-omni:144.0.20251027123126') {
        // GeckoView's latest AndroidX dependencies require newer Android build tools.
        exclude group: 'androidx.annotation', module: 'annotation-experimental'
        exclude group: 'androidx.core', module: 'core'
        exclude group: 'androidx.lifecycle', module: 'lifecycle-common'
        exclude group: 'androidx.lifecycle', module: 'lifecycle-process'
    }
    // Keep Gecko builds compatible with compileSdk 36 / AGP 8.9.1 and the API 23 baseline.
    geckoImplementation 'androidx.annotation:annotation-experimental:1.4.1'
    geckoImplementation 'androidx.core:core:1.13.1'
    geckoImplementation 'androidx.core:core-ktx:1.13.1'
    geckoImplementation 'androidx.lifecycle:lifecycle-common:2.8.7'
    geckoImplementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'com.github.alidili:FlowLayout:v1.5'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.11'
    implementation 'com.squareup.okio:okio:3.3.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.49-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.20') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.11.1"
    implementation "androidx.media3:media3-datasource-rtmp:1.11.1"
    implementation 'androidx.media3:media3-common:1.11.1'
    // nextlib 1.11.1 修复 FFmpeg 软解 Surface 颜色/清理问题(exo 花屏)
    implementation "io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.16.0"



    // MPV 版: 上游 AAR 的 FFmpeg 库与 nextlib 重名，改名后再打包
    mpvUpstream 'io.github.wohal:mpv-android-lib:0.2.4'
    mpvImplementation files(patchedMpvAar)
    mpvImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation "com.aliyun.sdk.android:AliyunPlayer:5.5.2.0-full"
    implementation 'com.alivc.conan:AlivcConan:0.9.5'
    implementation 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'
    implementation 'xyz.doikki.android.dkplayer:videocache:3.3.7'

    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.blankj:utilcodex:1.31.0'
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.13.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
//    implementation files('libs/thunder.jar')
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation 'com.github.seven332:jcifs:1.3.19'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'io.github.inflationx:viewpump:2.1.1'
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'com.yanzhenjie.andserver:api:2.1.12'
    kapt 'com.yanzhenjie.andserver:processor:2.1.12'
    implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    implementation('org.simpleframework:simple-xml:2.7.1') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
    }
    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }
}
