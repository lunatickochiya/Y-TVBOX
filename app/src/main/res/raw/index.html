<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Y-LIVE · 直播配置</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">▶</span> Y-LIVE</div>
      <h1>把直播带到大屏</h1>
      <p>在手机上填写地址，保存后电视会自动加载。</p>
      <div id="connection" class="connection" role="status">正在连接电视…</div>
    </header>
    <section class="card" aria-labelledby="live-title">
      <div class="card-heading"><span class="number" aria-hidden="true">01</span><div><h2 id="live-title">直播源</h2><p>支持 M3U / M3U8、TXT 频道列表</p></div></div>
      <form id="live-form" novalidate>
        <label for="live-url">直播源地址</label>
        <input id="live-url" name="url" type="url" inputmode="url" placeholder="https://example.com/live.m3u" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="live-current live-result">
        <p id="live-current" class="current">当前配置：读取中…</p>
        <button type="submit">保存直播源</button>
        <p id="live-result" class="result" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="card" aria-labelledby="epg-title">
      <div class="card-heading"><span class="number" aria-hidden="true">02</span><div><h2 id="epg-title">节目单 <span class="optional">可选</span></h2><p>配置 EPG，在电视上查看节目安排</p></div></div>
      <form id="epg-form" novalidate>
        <label for="epg-url">EPG 地址</label>
        <input id="epg-url" name="url" type="url" inputmode="url" placeholder="https://example.com/epg.xml.gz" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="epg-current epg-help epg-result">
        <p id="epg-current" class="current">当前配置：读取中…</p>
        <p id="epg-help" class="help">支持 XML / XML.GZ / JSON。留空保存可停用自定义节目单。</p>
        <button type="submit" class="secondary">保存节目单</button>
        <p id="epg-result" class="result" role="status" aria-live="polite"></p>
      </form>
    </section>
    <aside class="tips"><strong>连接提示</strong><p>手机与电视需连接同一局域网，并保持 Y-LIVE 打开。地址保存成功后，请在电视上确认频道或节目单是否加载完成。</p><button id="refresh" class="text-button" type="button">重新读取电视配置</button></aside>
    <footer>Y-LIVE · 纯直播，更简单</footer>
  </main>
</body>
</html>
